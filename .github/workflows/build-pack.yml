name: "Build, Test and Pack"

on:
  workflow_call:
    inputs:
      version:
        description: "Package version to stamp onto the build"
        required: true
        type: string
      ref:
        description: "Git ref (branch name) to check out before building"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-pack:
    name: "Build and Pack"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@cb9b7d9988dca51f32d98565a0447fa373f6b147 # v4.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Build, test and package
        uses: cake-build/cake-action@d218f1133bb74a1df0b08c89cfd8fc100c09e1a0 # v3.0.1
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          SOLUTION_FILE_NAME: ${{ vars.SOLUTION_FILE_NAME }}
          PACKAGE_VERSION: ${{ inputs.version }}
          OUTPUT_DIR: artifacts
        with:
          script-path: ./build.cake
          target: Pack

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@4cec3d8a4d47c6d7c4997f9303d89247f1d89210 # v4.6.1
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
